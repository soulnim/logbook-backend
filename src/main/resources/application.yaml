spring:
  datasource:
    # Supports Railway Postgres plugin variables (PGHOST etc.) with fallback to custom DB_* vars
    url: jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:logbook}}
    username: ${PGUSER:${DB_USER:app}}
    password: ${PGPASSWORD:${DB_PASS:app}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:     ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"

app:
  jwt:
    secret:      ${JWT_SECRET:super-secret-key-please-change-in-production-min-32-chars}
    expiry-days: 30
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: 8080
  # Trust Railway's reverse proxy so Spring uses https:// when building redirect URIs
  forward-headers-strategy: framework

logging:
  level:
    com.logbook.logbookbackend: DEBUG
    org.hibernate.SQL: INFO